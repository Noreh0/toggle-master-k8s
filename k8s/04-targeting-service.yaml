apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-targeting:latest
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          value: "8003"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TARGETING_DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: toggle-app
spec:
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: targeting-service