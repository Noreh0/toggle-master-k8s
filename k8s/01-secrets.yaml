apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: toggle-app
type: Opaque
stringData:
  AUTH_DB_URL: "REPLACE_WITH_AUTH_DATABASE_URL"
  FLAG_DB_URL: "REPLACE_WITH_FLAG_DATABASE_URL"
  TARGETING_DB_URL: "REPLACE_WITH_TARGETING_DATABASE_URL"
  MASTER_KEY: "REPLACE_WITH_MASTER_KEY"
  # Chave criada chamando POST /keys no auth-service (autenticado com a MASTER_KEY).
  # Usada pelo evaluation-service para se autenticar no flag-service e no targeting-service.
  SERVICE_API_KEY: "REPLACE_WITH_SERVICE_API_KEY"