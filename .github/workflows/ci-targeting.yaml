name: CI - targeting

on:
  push:
    branches: [main]
    paths: ["services/targeting/**"]
  pull_request:
    paths: ["services/targeting/**"]

env:
  SERVICE_NAME: targeting
  ECR_REPOSITORY: toggle-master-targeting
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r services/targeting/requirements.txt
      - name: Unit tests (se houver)
        run: |
          cd services/targeting
          if compgen -G "test_*.py" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pip install pytest
            pytest
          else
            echo "Nenhum teste encontrado ainda — pulando."
          fi

  lint:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: flake8
        run: |
          pip install flake8
          flake8 services/targeting --max-line-length=120

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: SCA - Trivy fs scan (dependências)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/targeting
          severity: CRITICAL
          exit-code: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SAST - bandit (código-fonte)
        run: |
          pip install bandit
          # --severity-level high = equivalente a "crítico" para o bandit (low/medium/high)
          bandit -r services/targeting --severity-level high --confidence-level high

  docker-build-push:
    runs-on: ubuntu-latest
    needs: security-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem (commit hash)
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha }} services/targeting

      - name: Container scan (Trivy na imagem)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha }}
          severity: CRITICAL
          exit-code: 1

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & Push para o ECR
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:v1.0.0-${{ steps.vars.outputs.sha }}"
          docker tag ${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha }} "$IMAGE"
          docker push "$IMAGE"

  update-gitops:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}

      - name: Atualizar tag da imagem no manifesto
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:v1.0.0-${{ needs.docker-build-push.outputs.image_tag }}"
          sed -i "s|image: .*|image: ${IMAGE}|" apps/targeting/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "update targeting image to ${{ needs.docker-build-push.outputs.image_tag }}"
          git push
